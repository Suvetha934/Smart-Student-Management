
<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <title>Redirecting...</title>
    <script>
      const path = window.location.pathname;
      const base = "/Smart-Student-Management";

      if (path.startsWith(base)) {
        const route = path.slice(base.length);
        sessionStorage.setItem("redirect", route + window.location.search + window.location.hash);
        window.location.replace(base + "/");
      }
    </script>
  </head>
  <body>
    Redirecting...
  </body>
</html>
